name: Build Android Host App & Rust Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Native Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust FFI for Android
        run: |
          mkdir -p android-host/app/src/main/jniLibs
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          
          FOUND_MANIFEST=$(find . -maxdepth 3 -name "Cargo.toml" -type f | head -n 1)
          
          if [ -n "$FOUND_MANIFEST" ]; then
            CARGO_DIR=$(dirname "$FOUND_MANIFEST")
          else
            mkdir -p core-ffi/src
            echo '[package]' > core-ffi/Cargo.toml
            echo 'name = "core_ffi"' >> core-ffi/Cargo.toml
            echo 'version = "0.1.0"' >> core-ffi/Cargo.toml
            echo 'edition = "2021"' >> core-ffi/Cargo.toml
            echo '' >> core-ffi/Cargo.toml
            echo '[lib]' >> core-ffi/Cargo.toml
            echo 'crate-type = ["cdylib"]' >> core-ffi/Cargo.toml
            echo '#[no_mangle]' > core-ffi/src/lib.rs
            echo 'pub extern "C" fn sideinstaller_init() {}' >> core-ffi/src/lib.rs
            CARGO_DIR="core-ffi"
          fi
          
          cd "$CARGO_DIR"
          ANDROID_NDK_HOME="$NDK_PATH" cargo ndk -t arm64-v8a -t x86_64 -o ../android-host/app/src/main/jniLibs -- build --release

      - name: Build Android Release APK
        run: |
          cd android-host
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          mkdir -p app/src/main
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-sdk
                  android:minSdkVersion="21"
                  android:targetSdkVersion="34" />
              
              <application
                  android:allowBackup="true"
                  android:debuggable="false"
                  android:label="SideInstaller"
                  android:theme="@android:style/Theme.Light">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          mkdir -p app/src/main/java/com/example/sideinstaller
          cat <<EOF > app/src/main/java/com/example/sideinstaller/MainActivity.java
          package com.example.sideinstaller;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          
          gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Android-Host-APK
          path: android-host/app/build/outputs/apk/release/*.apk
