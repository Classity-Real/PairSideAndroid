name: Build Android Host App & Rust Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Native Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust FFI for Android
        run: |
          mkdir -p android-host/app/src/main/jniLibs
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          
          cd core-ffi
          ANDROID_NDK_HOME=$NDK_PATH cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../android-host/app/src/main/jniLibs \
            -- build --release

      - name: Build Android Release APK
        run: |
          cd android-host
          gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Android-Host-APK
          path: android-host/app/build/outputs/apk/release/*.apk
