name: Build Android Host App & Rust Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GRADLE_VERSION: "9.4.0"

jobs:
  build-android:
    name: Build Android APK & Native Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle-dist
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ env.GRADLE_VERSION }}-${{ runner.os }}-

      - name: Download and install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          if [ ! -d "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}" ]; then
            mkdir -p "$HOME/.gradle-dist"
            curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
            rm /tmp/gradle.zip
          fi
          echo "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle install
        run: gradle --version

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust FFI for Android
        run: |
          mkdir -p android-host/app/src/main/jniLibs
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          
          FOUND_MANIFEST=$(find . -maxdepth 3 -name "Cargo.toml" -type f | head -n 1)
          
          if [ -n "$FOUND_MANIFEST" ]; then
            CARGO_DIR=$(dirname "$FOUND_MANIFEST")
            cd "$CARGO_DIR"
            ANDROID_NDK_HOME="$NDK_PATH" cargo ndk -t arm64-v8a -t x86_64 -o ../android-host/app/src/main/jniLibs -- build --release
          fi

      - name: Run Android Lint
        run: |
          gradle lintDebug --no-daemon

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename output APK
        id: apk
        run: |
          SRC="android-host/app/build/outputs/apk/debug/app-debug.apk"
          OUT_NAME="SideInstaller-Host-debug.apk"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$OUT_NAME"
            echo "apk_path=$OUT_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "APK not found at $SRC"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Android-Host-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-host/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
