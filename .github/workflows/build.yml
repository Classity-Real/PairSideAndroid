name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.2.0) — becomes the release tag AND the app versionName'
        required: true
        type: string
      changelog:
        description: 'Changelog for this release (used as-is as the release notes)'
        required: true
        type: string
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      apk_name:
        description: 'Base filename for the output APK (without version/extension)'
        required: true
        type: string
        default: 'PExt'

env:
  GRADLE_VERSION: "9.4.0"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          mkdir -p "$HOME/.gradle-dist"
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/.gradle-dist"
          rm /tmp/gradle.zip
          echo "$HOME/.gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Compute version properties
        id: version
        run: |
          echo "version_name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ inputs.build_type }} APK
        run: >
          gradle assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-daemon
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PappVersionCode=${{ steps.version.outputs.version_code }}

      - name: Rename output APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk"
          OUT_NAME="${{ inputs.apk_name }}-${{ inputs.version }}.apk"
          cp "$SRC" "$OUT_NAME"
          echo "apk_path=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.apk_name }}-${{ inputs.version }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: warn

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md
          gh release create "$RELEASE_VERSION" \
            "${{ steps.apk.outputs.apk_path }}" \
            --title "$RELEASE_VERSION" \
            --notes-file release_notes.md
