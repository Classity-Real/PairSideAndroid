name: Build Android Host App & Rust Core

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android APK & Native Libraries
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Set up Rust toolchain and add Android targets
      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      # 4. Install cargo-ndk tool
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # 5. Cross-compile Rust core into Android .so shared libraries
      # Using the pre-installed Android NDK on the runner
      - name: Build Rust FFI for Android
        run: |
          mkdir -p android-host/app/src/main/jniLibs
          
          # Find pre-installed NDK path dynamically if needed
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          cd core-ffi
          ANDROID_NDK_HOME=$NDK_PATH cargo ndk -t arm64-v8a -t x86_64 -o ../android-host/app/src/main/jniLibs build --release

      # 6. Grant execute permission for Gradle wrapper
      - name: Grant Executable Permission for Gradle
        run: chmod +x android-host/gradlew

      # 7. Build release APK with Gradle
      - name: Build Android Release APK
        run: |
          cd android-host
          ./gradlew assembleRelease --no-daemon

      # 8. Upload APK as GitHub Build Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Android-Host-APK
          path: android-host/app/build/outputs/apk/release/*.apk
