name: Build Android Host App & Rust Core

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Native Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust FFI for Android
        run: |
          mkdir -p android-host/app/src/main/jniLibs

          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"

          FOUND_MANIFEST=$(find . -maxdepth 3 -name "Cargo.toml" | head -n 1)

          if [ -n "$FOUND_MANIFEST" ]; then
            CARGO_DIR=$(dirname "$FOUND_MANIFEST")
            echo "Found existing Cargo.toml at: $FOUND_MANIFEST"
          else
            echo "Cargo.toml NOT FOUND! Generating fallback core-ffi crate..."
            mkdir -p core-ffi/src

            cat << 'EOF' > core-ffi/Cargo.toml
[package]
name = "core_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
EOF

            cat << 'EOF' > core-ffi/src/lib.rs
#[no_mangle]
pub extern "C" fn sideinstaller_init() {}
EOF

            CARGO_DIR="core-ffi"
          fi

          cd "$CARGO_DIR"

          ANDROID_NDK_HOME=$NDK_PATH cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../android-host/app/src/main/jniLibs \
            -- build --release

      - name: Ensure Gradle Wrapper Exists
        run: |
          cd android-host

          if [ ! -f "gradlew" ]; then
            if command -v gradle &> /dev/null; then
              gradle wrapper --gradle-version 8.5
            else
              curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
              unzip -q gradle.zip
              ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
              rm -rf gradle.zip gradle-8.5
            fi
          fi

          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android-host
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-Android-Host-APK
          path: android-host/app/build/outputs/apk/release/*.apk
